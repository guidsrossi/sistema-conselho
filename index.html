<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apresentação de Estudantes</title>
  <link rel="icon" type="image/jpeg" href="assets/logo-fanucchi.jpg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loadingOverlay" class="loadingOverlay">
    <div class="loader"></div>
    <p>Carregando estudantes...</p>
  </div>

  <header class="topbar">
    <div class="brand">
      <img src="assets/logo-fanucchi.jpg" alt="Fabio Fanucchi Ensino Médio Integral" />
      <div>
      <h1>Apresentação de Estudantes</h1>
      <p>Dados carregados do Google Planilhas e fotos do Google Drive.</p>
      </div>
    </div>
    <div class="actions">
      <button id="btnTheme" type="button" aria-pressed="false">Tema claro</button>
      <button id="btnFullscreen" type="button">Tela cheia</button>
      <button id="btnRandom" type="button">Aleatório</button>
      <button id="btnPrev" type="button">◀ Anterior</button>
      <button id="btnNext" type="button">Próximo ▶</button>
    </div>
  </header>

  <section class="controls">
    <label>
      Turma
      <select id="turmaSelect"></select>
    </label>

    <label>
      Buscar aluno
      <input id="searchInput" type="text" placeholder="Digite o nome..." />
    </label>

    <div class="apiStatusBox">
      <span id="apiStatus">Carregando dados do Google Planilhas e Drive...</span>
      <button id="btnReloadApi" type="button">Atualizar dados</button>
    </div>
  </section>

  <main class="stage">
    <aside class="listPanel">
      <div class="listHeader">
        <strong>Alunos</strong>
        <span id="countInfo"></span>
      </div>
      <div id="studentList" class="studentList"></div>
    </aside>

    <section class="presentation" id="presentation">
      <div class="studentHeader">
        <span id="serieBadge" class="badge"></span>
        <h2 id="studentName"></h2>
      </div>

      <div class="photoFrame" id="photoFrame">
        <img id="studentPhoto" alt="Foto do estudante" />
        <div id="noPhoto" class="noPhoto">Sem foto</div>
      </div>

      <div class="studentInfo">
        <p id="studentClass"></p>
        <p id="studentTutor" class="studentTutor"></p>
        <p id="studentFrequency" class="studentFrequency"></p>
        <small id="matchInfo"></small>
        <div id="gradesPanel" class="gradesPanel"></div>
      </div>
    </section>
  </main>

  <footer>
    Dica: use as setas do teclado para avançar/voltar. Pressione F para tela cheia.
  </footer>

  <script src="app.js"></script>
</body>
</html>
